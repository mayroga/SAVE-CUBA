<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAVE CUBA - Sistema de Asesoría Documental</title>
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-color: #2563eb;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #334155;
            --border-color: #cbd5e1;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: var(--primary-color);
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            font-size: 14px;
            color: var(--primary-color);
        }
        input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            border-color: var(--accent-color);
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .col {
            flex: 1;
        }
        .conditional-field {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #f1f5f9;
            border-radius: 6px;
            border-left: 4px solid var(--accent-color);
        }
        button {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
        #resultado {
            margin-top: 20px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>AL CIELO - Gestión de Trámites</h2>
    <form id="tramiteForm">
        
        <div class="form-group">
            <label for="tramite_tipo">Seleccione el Trámite:</label>
            <select id="tramite_tipo" name="tramite_tipo" required onchange="cambiarFlujoTrámite()">
                <option value="">-- Elija una opción --</option>
                <option value="paquete_completo_uscis">Residencia y Trabajo USA (USCIS)</option>
                <option value="pasaporte_cubano">Pasaporte Cubano (Trámite Consular)</option>
                <option value="naturalizacion_n400">Ciudadanía Americana (N-400)</option>
            </select>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="primer_nombre">Primer Nombre *</label>
                    <input type="text" id="primer_nombre" name="primer_nombre" required>
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="segundo_nombre">Segundo Nombre</label>
                    <input type="text" id="segundo_nombre" name="segundo_nombre">
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col">
                <div class="form-group">
                    <label for="primer_apellido">Primer Apellido *</label>
                    <input type="text" id="primer_apellido" name="primer_apellido" required>
                </div>
            </div>
            <div class="col">
                <div class="form-group">
                    <label for="segundo_apellido">Segundo Apellido</label>
                    <input type="text" id="segundo_apellido" name="segundo_apellido">
                </div>
            </div>
        </div>

        <div class="form-group">
            <label for="fecha_nacimiento">Fecha de Nacimiento *</label>
            <input type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
        </div>
 <!-- CAMPOS CONDICIONALES PARA USCIS (RESIDENCIA / CIUDADANÍA) -->
        <div id="seccion_uscis" class="conditional-field">
            <div class="form-group">
                <label for="anumber">Número de Registro (A-Number) *</label>
                <input type="text" id="anumber" name="anumber" placeholder="Ej: A123456789">
            </div>
            <div class="form-group">
                <label for="empleo_cuba_espanol">Último Empleo / Historial en Cuba (Español)</label>
                <input type="text" id="empleo_cuba_espanol" name="empleo_cuba_espanol" placeholder="Ej: Ingeniero Agrónomo">
            </div>
        </div>

        <!-- CAMPOS CONDICIONALES PARA TRÁMITE CONSULAR (PASAPORTE CUBANO) -->
        <div id="seccion_consular" class="conditional-field">
            <div class="form-group">
                <label for="pasaporte_actual">Número de Pasaporte Actual *</label>
                <input type="text" id="pasaporte_actual" name="pasaporte_actual" placeholder="Ej: P123456">
            </div>
            <div class="row">
                <div class="col">
                    <div class="form-group">
                        <label for="provincia_cuba">Provincia de Origen en Cuba *</label>
                        <input type="text" id="provincia_cuba" name="provincia_cuba" placeholder="Ej: La Habana">
                    </div>
                </div>
                <div class="col">
                    <div class="form-group">
                        <label for="ano_salida_cuba">Año de Salida de Cuba *</label>
                        <input type="text" id="ano_salida_cuba" name="ano_salida_cuba" placeholder="Ej: 2021">
                    </div>
                </div>
            </div>
            <div class="form-group">
                <label for="empleo_cuba_espanol_pasaporte">Último Empleo u Oficio en Cuba *</label>
                <input type="text" id="empleo_cuba_espanol_pasaporte" name="empleo_cuba_espanol_pasaporte" placeholder="Ej: Profesor">
            </div>
        </div>

        <button type="submit">Generar Trámite Documental</button>
    </form>

    <div id="resultado"></div>
</div>

<script>
    function cambiarFlujoTrámite() {
        const tipo = document.getElementById('tramite_tipo').value;
        const secUscis = document.getElementById('seccion_uscis');
        const secConsular = document.getElementById('seccion_consular');

        // Ocultar ambos por defecto
        secUscis.style.display = 'none';
        secConsular.style.display = 'none';

        // Mostrar según la selección
        if (tipo === 'paquete_completo_uscis' || tipo === 'naturalizacion_n400') {
            secUscis.style.display = 'block';
        } else if (tipo === 'pasaporte_cubano') {
            secConsular.style.display = 'block';
        }
    }

    document.getElementById('tramiteForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const resultadoDiv = document.getElementById('resultado');
        resultadoDiv.style.color = '#2563eb';
        resultadoDiv.innerText = 'Procesando trámite, por favor espere...';

        const tipo = document.getElementById('tramite_tipo').value;
        
        // Unificar el campo de empleo según el flujo activo
        let empleoFinal = "";
        if (tipo === 'paquete_completo_uscis' || tipo === 'naturalizacion_n400') {
            empleoFinal = document.getElementById('empleo_cuba_espanol').value;
        } else if (tipo === 'pasaporte_cubano') {
            empleoFinal = document.getElementById('empleo_cuba_espanol_pasaporte').value;
        }

        const datos = {
            primer_nombre: document.getElementById('primer_nombre').value,
            segundo_nombre: document.getElementById('segundo_nombre').value,
            primer_apellido: document.getElementById('primer_apellido').value,
            segundo_apellido: document.getElementById('segundo_apellido').value,
            fecha_nacimiento: document.getElementById('fecha_nacimiento').value,
            anumber: document.getElementById('anumber').value || "",
            pasaporte_actual: document.getElementById('pasaporte_actual').value || "",
            provincia_cuba: document.getElementById('provincia_cuba').value || "",
            ano_salida_cuba: document.getElementById('ano_salida_cuba').value || "",
            empleo_cuba_espanol: empleoFinal,
            tramite_tipo: tipo
        };

        try {
            const response = await fetch('/procesar_tramite', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(datos)
            });

            const resultado = await response.json();

            if (response.ok) {
                resultadoDiv.style.color = '#16a34a';
                resultadoDiv.innerHTML = `¡Éxito! Documento generado correctamente.<br><a href="/salidas/${resultado.archivo}" target="_blank" style="color: #2563eb; font-weight: bold; text-decoration: underline;">Descargar PDF del Trámite</a>`;
            } else {
                resultadoDiv.style.color = '#dc2626';
                resultadoDiv.innerText = 'Error: ' + (resultado.detail || 'Ocurrió un fallo en el sistema.');
            }
        } catch (error) {
            resultadoDiv.style.color = '#dc2626';
            resultadoDiv.innerText = 'Error de conexión con el servidor.';
        }
    });
</script>

</body>
</html>
